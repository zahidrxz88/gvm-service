  const enriched = useMemo(() => requests.map(r => {
    const schedule = (r.schedule || []).map(s => ({ ...s, status: slotStatus(s) }));
    const pending = schedule.filter(s => !s.completed);
    const nextTwo = pending.slice(0, 2);
    const overdueCount = schedule.filter(s => s.status === "overdue").length;
    const dueSoonCount = schedule.filter(s => s.status === "due-soon").length;
    const completedCount = schedule.filter(s => s.completed).length;
    // token requests are a running balance with no "done" state, so they always count as open
    const remaining = r.type === "token" ? 1 : schedule.length - completedCount;
    const rate = r.type === "token" ? findRate(rateCard, r.client, r.city) : null;
    const hourTier = r.type === "token" ? deriveHourTier(r.requestDate, r.startTime) : null;
    const durationHours = r.type === "token" ? hoursBetween(r.startTime, r.endTime) : null;
    let unitRate = null;
    if (rate && hourTier) {
      const tier = HOUR_TIERS.find(t => t.value === hourTier) || HOUR_TIERS[0];
      unitRate = rate[tier.rateField];
    }
    const estCost = (unitRate != null && durationHours != null) ? unitRate * durationHours : null;
    return { ...r, schedule, nextTwo, overdueCount, dueSoonCount, completedCount, remaining, hourTier, durationHours, unitRate, estCost };
  }), [requests, rateCard]);

  const upcomingFeed = useMemo(() => {
    const items = [];
    enriched.forEach(r => {
      r.nextTwo.forEach(s => {
        if (s.date) items.push({
          requestId: r.id, slotId: s.id, refNo: r.refNo, client: r.client,
          address: r.address, region: r.region, date: s.date, status: s.status
        });
      });
    });
    return items.filter(item => !filterRegion || (item.region || "").toLowerCase() === filterRegion.toLowerCase())
      .sort((a, b) => a.date < b.date ? -1 : 1).slice(0, 2);
  }, [enriched, filterRegion]);

  const isJobRequest = r => (r.type === "adhoc" && r.remaining > 0) || (r.type === "token" && !isTokenAccount(r));
  const isPastDue = r => r.requestDate < todayStr();
  const matchesRegion = r => !filterRegion || (r.region || "").toLowerCase() === filterRegion.toLowerCase();

  const allRegionsList = useMemo(() => {
    const set = new Set();
    requests.forEach(r => { if (r.region) set.add(r.region); });
    rateCard.forEach(r => { if (r.region) set.add(r.region); });
    return [...set].sort();
  }, [requests, rateCard]);

  const filteredRateCard = useMemo(() =>
    filterRegion ? rateCard.filter(r => (r.region || "").toLowerCase() === filterRegion.toLowerCase()) : rateCard,
  [rateCard, filterRegion]);

  const openRequests = useMemo(() =>
    enriched.filter(r => isJobRequest(r) && !isPastDue(r) && matchesRegion(r))
      .sort((a, b) => a.requestDate < b.requestDate ? 1 : a.requestDate > b.requestDate ? -1 : 0),
  [enriched, filterRegion]);
  const closedRequests = useMemo(() =>
    enriched.filter(r => isJobRequest(r) && isPastDue(r) && matchesRegion(r))
      .sort((a, b) => a.requestDate < b.requestDate ? 1 : a.requestDate > b.requestDate ? -1 : 0),
  [enriched, filterRegion]);
  const activeTokenRequests = useMemo(() =>
    enriched.filter(r => isTokenAccount(r) && matchesRegion(r)).sort((a, b) => a.requestDate < b.requestDate ? 1 : a.requestDate > b.requestDate ? -1 : 0),
  [enriched, filterRegion]);

  const stats = useMemo(() => {
    const open = enriched.filter(r => isJobRequest(r) && !isPastDue(r) && matchesRegion(r)).length;
    const activeTokens = enriched.filter(r => isTokenAccount(r) && matchesRegion(r)).length;
    return { open, activeTokens };
  }, [enriched, filterRegion]);

  const onlineUsers = useMemo(() => {
    const now = Date.now();
    return Object.entries(presence)
      .filter(([id, p]) => now - new Date(p.lastSeen).getTime() < PRESENCE_WINDOW_MS)
      .map(([id, p]) => ({ id, ...p }))
      .sort((a, b) => fullName(a).localeCompare(fullName(b)));
  }, [presence]);

  const exportRequestsCsv = () => {
    if (!isAdmin) return;
    const header = ["Reference No", "Client", "City", "Address", "Region", "Type", "Rate Tier", "Balance ($)", "Deducted ($)", "Rate ($)", "Est. Cost ($)", "Request Date", "Start Time", "End Time", "Description"];
    const rows = enriched.map(r => {
      const isTok = r.type === "token";
      const isAcct = isTokenAccount(r);
      const tokenUnitLabel = isTok && r.hourTier
        ? (HOUR_TIERS.find(t => t.value === r.hourTier) || HOUR_TIERS[0]).label
        : "";
      return [
        r.refNo, r.client, r.city || "", r.address, r.region || "",
        isTok ? (isAcct ? "Token Account" : "Token Job") : "Adhoc",
        tokenUnitLabel,
        isAcct ? r.tokenCount : "",
        isTok && !isAcct && r.deductionApplied ? r.deductedAmount : "",
        isTok && r.unitRate != null ? r.unitRate : "",
        isTok && r.estCost != null ? r.estCost : "",
        r.requestDate,
        r.startTime || "",
        r.endTime || "",
        r.scope || ""
      ];
    });
    downloadCsv(`adhoc-token-requests-${todayStr()}.csv`, [header, ...rows]);
    logActivity("export-csv", `Exported ${rows.length} request${rows.length === 1 ? "" : "s"} to CSV`);
  };

  if (!authReady) {
    return (
      <div style={{ minHeight: "100vh", background: "#0B0E0C", display: "flex", alignItems: "center", justifyContent: "center", color: "#8B948E", fontFamily: "'Space Grotesk', sans-serif" }}>
        Loading…
      </div>
    );
  }

  if (passwordRecovery) {
    return (
      <div style={{ minHeight: "100vh", background: "#0B0E0C", display: "flex", alignItems: "center", justifyContent: "center", padding: 20, color: "#E8ECE9", fontFamily: "'Space Grotesk', sans-serif" }}>
        <div style={{ width: "100%", maxWidth: 420, background: "#0E1210", border: "1px solid #1E2320", borderRadius: 14, padding: 28 }}>
          <h1 style={{ fontSize: 22, fontWeight: 700, margin: "0 0 4px" }}>Set a new password</h1>
          <div className="mono" style={{ fontSize: 10.5, letterSpacing: 1.5, color: "#8B948E", marginBottom: 22 }}>ADHOC / TOKEN SYSTEM</div>
          <div style={{ display: "grid", gap: 12 }}>
            <Field label="New password">
              <input type="password" value={newPassword} onChange={e => setNewPassword(e.target.value)}
                onKeyDown={e => e.key === "Enter" && submitNewPassword()} placeholder="Min 6 characters" style={inputStyle} />
            </Field>
            <Field label="Confirm new password">
              <input type="password" value={newPasswordConfirm} onChange={e => setNewPasswordConfirm(e.target.value)}
                onKeyDown={e => e.key === "Enter" && submitNewPassword()} style={inputStyle} />
            </Field>
            {updatePwError && <div style={{ color: "#F2545B", fontSize: 12 }}>{updatePwError}</div>}
            {updatePwNotice && <div style={{ color: "#4ADE9C", fontSize: 12 }}>{updatePwNotice}</div>}
            <button onClick={submitNewPassword} disabled={updatePwBusy}
              style={{ background: "#4ADE9C", color: "#0B0E0C", border: "none", borderRadius: 8, padding: "11px 0", fontWeight: 600, fontSize: 14, opacity: updatePwBusy ? 0.6 : 1 }}>
              {updatePwBusy ? "Please wait…" : "Update Password"}
            </button>
          </div>
        </div>
      </div>
    );
  }

  if (!currentUser) {
    return (
      <div style={{ minHeight: "100vh", background: "#0B0E0C", display: "flex", alignItems: "center", justifyContent: "center", padding: 20, color: "#E8ECE9", fontFamily: "'Space Grotesk', sans-serif" }}>
        <div style={{ width: "100%", maxWidth: 420, background: "#0E1210", border: "1px solid #1E2320", borderRadius: 14, padding: 28 }}>
          <h1 style={{ fontSize: 22, fontWeight: 700, margin: "0 0 4px" }}>Adhoc / Token System</h1>
          <div className="mono" style={{ fontSize: 10.5, letterSpacing: 1.5, color: "#8B948E", marginBottom: 22 }}>GLOBAL VISION MULTIMEDIA · A RICOH COMPANY</div>

          {authMode !== "forgot" && (
            <div style={{ display: "flex", gap: 6, marginBottom: 18 }}>
              {[["login", "Log In"], ["register", "Register"]].map(([tab, label]) => (
                <button key={tab} type="button" className="type-btn" onClick={() => { setAuthMode(tab); setAuthError(""); setAuthNotice(""); }}
                  style={{
                    flex: 1, padding: "10px 4px", borderRadius: 7, fontWeight: 600, fontSize: 12.5,
                    border: authMode === tab ? "1px solid #4ADE9C" : "1px solid #262B27",
                    background: authMode === tab ? "#4ADE9C22" : "transparent",
                    color: authMode === tab ? "#4ADE9C" : "#8B948E"
                  }}>{label}</button>
              ))}
            </div>
          )}

          {authMode === "forgot" ? (
            <div style={{ display: "grid", gap: 12 }}>
              <div className="mono" style={{ fontSize: 10.5, color: "#8B948E", marginTop: -8 }}>
                Enter your account email and we'll send you a password reset link.
              </div>
              <Field label="Email">
                <input type="email" value={authEmail} onChange={e => setAuthEmail(e.target.value)}
                  onKeyDown={e => e.key === "Enter" && submitForgotPassword()} placeholder="you@example.com" style={inputStyle} />
              </Field>
              {authError && <div style={{ color: "#F2545B", fontSize: 12 }}>{authError}</div>}
              {authNotice && <div style={{ color: "#4ADE9C", fontSize: 12 }}>{authNotice}</div>}
              <button onClick={submitForgotPassword} disabled={authBusy}
                style={{ background: "#4ADE9C", color: "#0B0E0C", border: "none", borderRadius: 8, padding: "11px 0", fontWeight: 600, fontSize: 14, opacity: authBusy ? 0.6 : 1 }}>
                {authBusy ? "Please wait…" : "Send Reset Link"}
              </button>
              <button type="button" onClick={() => { setAuthMode("login"); setAuthError(""); setAuthNotice(""); }}
                style={{ background: "none", border: "none", color: "#8B948E", fontSize: 12.5, cursor: "pointer", padding: 0, textAlign: "left" }}>
                ← Back to log in
              </button>
            </div>
          ) : (
            <div style={{ display: "grid", gap: 12 }}>
              {authMode === "register" && (
                <React.Fragment>
                  <Field label="First name"><TextInput value={authFirst} onChange={setAuthFirst} placeholder="JANE" uppercase /></Field>
                  <Field label="Last name"><TextInput value={authLast} onChange={setAuthLast} placeholder="DOE" uppercase /></Field>
                </React.Fragment>
              )}
              <Field label="Email">
                <input type="email" value={authEmail} onChange={e => setAuthEmail(e.target.value)}
                  onKeyDown={e => e.key === "Enter" && submitAuth()} placeholder="you@example.com" style={inputStyle} />
              </Field>
              <Field label={authMode === "register" ? "Choose a password" : "Password"}>
                <input type="password" value={authPassword} onChange={e => setAuthPassword(e.target.value)}
                  onKeyDown={e => e.key === "Enter" && submitAuth()}
                  placeholder={authMode === "register" ? "Min 6 characters" : ""} style={inputStyle} />
              </Field>
              {authMode === "login" && (
                <button type="button" onClick={() => { setAuthMode("forgot"); setAuthError(""); setAuthNotice(""); }}
                  style={{ background: "none", border: "none", color: "#6E9FB0", fontSize: 12.5, cursor: "pointer", padding: 0, textAlign: "left", marginTop: -6 }}>
                  Forgot password?
                </button>
              )}
              {authMode === "register" && (
                <div className="mono" style={{ fontSize: 10.5, color: "#8B948E" }}>
                  New accounts start as Guest (view only) until an Admin promotes you.
                </div>
              )}
              {authError && <div style={{ color: "#F2545B", fontSize: 12 }}>{authError}</div>}
              {authNotice && <div style={{ color: "#4ADE9C", fontSize: 12 }}>{authNotice}</div>}
              <button onClick={submitAuth} disabled={authBusy}
                style={{ background: "#4ADE9C", color: "#0B0E0C", border: "none", borderRadius: 8, padding: "11px 0", fontWeight: 600, fontSize: 14, opacity: authBusy ? 0.6 : 1 }}>
                {authBusy ? "Please wait…" : authMode === "register" ? "Register" : "Log In"}
              </button>
            </div>
          )}
        </div>
      </div>
    );
  }

  return (
    <div style={{ minHeight: "100vh", background: "#0B0E0C", fontFamily: "'Space Grotesk', sans-serif", color: "#E8ECE9" }}>
      <div style={{ borderBottom: "1px solid #1E2320", padding: "28px 32px 24px" }}>
        <div style={{ maxWidth: 1180, margin: "0 auto" }}>
          <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", flexWrap: "wrap", gap: 16 }}>
            <div>
              <h1 style={{ fontSize: 30, fontWeight: 500, margin: 0, letterSpacing: -0.5 }}>Adhoc / Token System</h1>
              <div className="mono" style={{ fontSize: 11, letterSpacing: 2, color: "#8B948E", marginTop: 5 }}>GLOBAL VISION MULTIMEDIA · A RICOH COMPANY</div>
            </div>
            <div style={{ display: "flex", alignItems: "center", gap: 10, flexWrap: "wrap" }}>
              <div style={{ display: "flex", alignItems: "center" }}>
                {onlineUsers.map((u, i) => (
                  <div key={u.id} onClick={() => setPresenceTapped(t => t === u.id ? null : u.id)}
                    title={`${u.firstName} ${u.lastName} · ${ROLE_LABEL[u.role]}`}
                    style={{
                      width: 28, height: 28, borderRadius: "50%", marginLeft: i === 0 ? 0 : -8,
                      background: "#0E1210", border: `2px solid ${ROLE_COLOR[u.role] || "#8B948E"}`,
                      display: "flex", alignItems: "center", justifyContent: "center",
                      fontSize: 10.5, fontWeight: 700, color: ROLE_COLOR[u.role] || "#8B948E", cursor: "pointer",
                      position: "relative", zIndex: onlineUsers.length - i
                    }}>{initials(u.firstName, u.lastName)}</div>
                ))}
              </div>
              {presenceTapped && onlineUsers.find(u => u.id === presenceTapped) && (
                <span className="mono" style={{ fontSize: 11, color: "#8B948E" }}>
                  {fullName(onlineUsers.find(u => u.id === presenceTapped))} · {ROLE_LABEL[onlineUsers.find(u => u.id === presenceTapped).role]}
                </span>
              )}
              <div className="mono" style={{ display: "flex", alignItems: "center", gap: 8, fontSize: 11, color: "#8B948E" }}>
                <span style={{ display: "flex", alignItems: "center", gap: 6 }}>
                  <Shield size={12} color={ROLE_COLOR[role]} />
                  {fullName(currentUser)} · {ROLE_LABEL[role]}
                </span>
                <button onClick={logout} style={{ background: "none", border: "1px solid #262B27", borderRadius: 6, padding: "5px 9px", color: "#8B948E", fontSize: 11 }}>Log out</button>
              </div>
              {isSuperAdmin && (
                <React.Fragment>
                  <button onClick={() => setManageUsersOpen(true)} style={{ display: "flex", alignItems: "center", gap: 8, background: "transparent", color: "#E8ECE9", border: "1px solid #262B27", borderRadius: 8, padding: "12px 18px", fontWeight: 600, fontSize: 14 }}>
                    <UsersIcon size={16} /> Manage Users
                  </button>
                  <button onClick={() => setActivityLogOpen(true)} style={{ display: "flex", alignItems: "center", gap: 8, background: "transparent", color: "#E8ECE9", border: "1px solid #262B27", borderRadius: 8, padding: "12px 18px", fontWeight: 600, fontSize: 14 }}>
                    <ListIcon size={16} /> Activity Log
                  </button>
                </React.Fragment>
              )}
              {isAdmin && (
                <React.Fragment>
                  <button onClick={() => setRateChooserOpen(true)} style={{ display: "flex", alignItems: "center", gap: 8, background: "transparent", color: "#4ADE9C", border: "1px solid #4ADE9C55", borderRadius: 8, padding: "12px 18px", fontWeight: 600, fontSize: 14 }}>
                    <Pencil size={16} /> Edit Rate Card
                  </button>
                  <button onClick={openTopUp} style={{ display: "flex", alignItems: "center", gap: 8, background: "transparent", color: "#6E9FB0", border: "1px solid #6E9FB055", borderRadius: 8, padding: "12px 18px", fontWeight: 600, fontSize: 14 }}>
                    <Ticket size={16} /> Top Up Tokens
                  </button>
                  <button onClick={openAdd} style={{ display: "flex", alignItems: "center", gap: 8, background: "#4ADE9C", color: "#0B0E0C", border: "none", borderRadius: 8, padding: "12px 18px", fontWeight: 600, fontSize: 14 }}>
                    <Plus size={16} /> Add Request
                  </button>
                  <button onClick={exportRequestsCsv} style={{ display: "flex", alignItems: "center", gap: 8, background: "transparent", color: "#E8ECE9", border: "1px solid #262B27", borderRadius: 8, padding: "12px 18px", fontWeight: 600, fontSize: 14 }}>
                    <Download size={16} /> Export CSV
                  </button>
                </React.Fragment>
              )}
            </div>
          </div>
          <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(150px, 1fr))", gap: 12, marginTop: 24 }}>
            <StatBox label="OPEN REQUESTS" value={stats.open} color="#E8ECE9" />
            <StatBox label="ACTIVE TOKEN" value={stats.activeTokens} color="#4ADE9C" />
          </div>
        </div>
      </div>

      <div style={{ maxWidth: 1180, margin: "0 auto", padding: "32px" }}>
        <div style={{ display: "flex", flexWrap: "wrap", gap: 8, marginBottom: 28 }}>
          <select value={filterRegion} onChange={e => setFilterRegion(e.target.value)}
            className="mono"
            style={{ ...selectStyle, width: "auto", textTransform: "uppercase", fontSize: 12, fontWeight: 600, padding: "10px 14px", letterSpacing: 0.3 }}>
            <option value="">REGION: ALL</option>
            {allRegionsList.map(r => <option key={r} value={r}>{r.toUpperCase()}</option>)}
          </select>
          {[
            ["upcoming", "UPCOMING VISIT"],
            ["open", "OPEN REQUEST"],
            ["closed", "CLOSED REQUEST"],
            ["active", "ACTIVE TOKENS"],
            ["rate", "RATE CARD"]
          ].map(([key, label]) => (
            <button key={key} type="button" onClick={() => setSectionFilters(f => ({ ...f, [key]: !f[key] }))}
              className="mono"
              style={{
                padding: "10px 14px", borderRadius: 8, fontWeight: 600, fontSize: 12, letterSpacing: 0.3,
                border: sectionFilters[key] ? "1px solid #4ADE9C" : "1px solid #262B27",
                background: sectionFilters[key] ? "#4ADE9C22" : "transparent",
                color: sectionFilters[key] ? "#4ADE9C" : "#8B948E"
              }}>{label}</button>
          ))}
        </div>

        {isUser && sectionFilters.upcoming && (
          <section style={{ marginBottom: 40 }}>
            <SectionHeader title="Upcoming Visits" sub="Next scheduled, across all requests" />
            {upcomingFeed.length === 0 ? (
              <EmptyRow text={requests.length === 0 ? "Add a request to start tracking visits." : "Select dates on your requests to see them here."} />
            ) : (
              <div style={{ border: "1px solid #1E2320", borderRadius: 10, overflow: "hidden" }}>
                {upcomingFeed.map((item, i) => {
                  const isNext = i === 0;
                  return (
                    <div key={item.requestId + item.slotId} style={{ padding: isNext ? "20px 20px" : "13px 16px", background: i % 2 === 0 ? "#0E1210" : "#0B0E0C", borderBottom: i === upcomingFeed.length - 1 ? "none" : "1px solid #1E2320" }}>
                      <div style={{ display: "flex", alignItems: "center", gap: isNext ? 12 : 10 }}>
                        <div className={`jack jack-glow${isNext ? " jack-pulse" : ""}`} style={{ background: STATUS_COLOR[item.status], color: STATUS_COLOR[item.status], width: isNext ? 14 : 10, height: isNext ? 14 : 10 }} />
                        <span className="mono" style={{ fontSize: isNext ? 16 : 13, color: isNext ? "#E8ECE9" : "#8B948E" }}>{fmtShort(item.date)}</span>
                        <span className="mono" style={{ fontSize: isNext ? 11 : 10, letterSpacing: 0.5, color: "#6E9FB0", border: "1px solid #6E9FB055", borderRadius: 5, padding: isNext ? "4px 10px" : "3px 8px" }}>UPCOMING</span>
                      </div>
                      <div style={{ fontSize: isNext ? 20 : 14, fontWeight: 700, marginTop: isNext ? 12 : 8, wordBreak: "break-word" }}>{item.client || "Untitled client"}</div>
                      <div className="mono" style={{ fontSize: isNext ? 13 : 11, color: "#8B948E", marginTop: 3 }}>{item.refNo}</div>
                      <div style={{ fontSize: isNext ? 14 : 12, color: "#8B948E", marginTop: 3, wordBreak: "break-word" }}>
                        {item.address || "No address specified"}
                        {item.city && <span className="mono" style={{ color: "#4ADE9C" }}> · {item.city.toUpperCase()}</span>}
                        {item.region && <span className="mono" style={{ color: "#6E9FB0" }}> · {item.region.toUpperCase()}</span>}
                      </div>
                    </div>
                  );
                })}
              </div>
            )}
          </section>
        )}

        {sectionFilters.open && (
        <section>
          <SectionHeader title="Open Requests" sub={`${openRequests.length} on file`} />
          {openRequests.length === 0 ? (
            <EmptyRow text={requests.length === 0 ? "No adhoc/token requests yet." : "No open requests."} />
          ) : (
            <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fill, minmax(320px, 1fr))", gap: 14 }}>
              {openRequests.map(r => (
                <RequestCard key={r.id} r={r} isAdmin={isAdmin}
                  onEdit={() => openEdit(r)} onDelete={() => setConfirmDelete(r.id)} />
              ))}
            </div>
          )}
        </section>
        )}

        {sectionFilters.closed && (
        <section style={{ marginTop: 40 }}>
          <SectionHeader title="Closed Requests" sub={`${closedRequests.length} on file`} />
          {closedRequests.length === 0 ? (
            <EmptyRow text="No closed requests." />
          ) : (
            <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fill, minmax(320px, 1fr))", gap: 14 }}>
              {closedRequests.map(r => (
                <RequestCard key={r.id} r={r} isAdmin={isAdmin}
                  onEdit={() => openEdit(r)} onDelete={() => setConfirmDelete(r.id)} />
              ))}
            </div>
          )}
        </section>
        )}

        {sectionFilters.active && (
        <section style={{ marginTop: 40 }}>
          <SectionHeader title="Active Tokens" sub={`${activeTokenRequests.length} on file`} />
          {activeTokenRequests.length === 0 ? (
            <EmptyRow text="No active token requests." />
          ) : (
            <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fill, minmax(320px, 1fr))", gap: 14 }}>
              {activeTokenRequests.map(r => (
                <RequestCard key={r.id} r={r} isAdmin={isAdmin}
                  onEdit={() => openEdit(r)} onDelete={() => setConfirmDelete(r.id)} />
              ))}
            </div>
          )}
        </section>
        )}

        {sectionFilters.rate && (
        <section style={{ marginTop: 40 }}>
          {(() => {
            const clientCount = new Set(filteredRateCard.map(r => r.client)).size;
            return (
              <SectionHeader title="Rate Card" sub={`${clientCount} client${clientCount === 1 ? "" : "s"} · ${filteredRateCard.length} cit${filteredRateCard.length === 1 ? "y" : "ies"} on file`} />
            );
          })()}
          <div className="mono" style={{ fontSize: 11, color: "#8B948E", marginBottom: 14 }}>
            Rates are matched by client + city and feed the estimated cost on token requests. Use Edit Rate Card → Add Rate to add another city for an existing client, or Top Up Tokens → New Client to onboard a brand new client.
          </div>
          {filteredRateCard.length === 0 ? (
            <EmptyRow text="No rates on file yet." />
          ) : (
            <div style={{ display: "grid", gap: 16 }}>
              {Object.entries(filteredRateCard.reduce((acc, r) => { (acc[r.client] = acc[r.client] || []).push(r); return acc; }, {})).map(([client, rates]) => (
                <div key={client} style={{ border: "1px solid #1E2320", borderRadius: 10, overflow: "hidden" }}>
                  <div style={{ padding: "10px 16px", background: "#12181580", fontWeight: 700, fontSize: 14 }}>{client}</div>
                  {rates.map((rate, i) => (
                    <div key={rate.id} style={{ display: "flex", alignItems: "flex-start", justifyContent: "space-between", gap: 12, padding: "14px 16px", background: i % 2 === 0 ? "#0E1210" : "#0B0E0C", borderTop: "1px solid #1E2320", flexWrap: "wrap" }}>
                      <div style={{ minWidth: 0 }}>
                        <div style={{ fontWeight: 600, fontSize: 13 }}>
                          {rate.city}
                          {rate.region && <span className="mono" style={{ color: "#6E9FB0", fontWeight: 400, fontSize: 11 }}> · {rate.region.toUpperCase()}</span>}
                        </div>
                      </div>
                      <div style={{ display: "flex", gap: 18, fontSize: 12, flexWrap: "wrap" }}>
                        <div>
                          <div className="mono" style={{ color: "#8B948E", fontSize: 10 }}>WEEKDAY BIZ HRS</div>
                          <div className="mono">{rate.hourRateWeekdayBiz != null ? rate.hourRateWeekdayBiz.toLocaleString() : "—"}</div>
                        </div>
                        <div>
                          <div className="mono" style={{ color: "#8B948E", fontSize: 10 }}>WEEKDAY AFTER HRS</div>
                          <div className="mono">{rate.hourRateWeekdayAfter != null ? rate.hourRateWeekdayAfter.toLocaleString() : "—"}</div>
                        </div>
                        <div>
                          <div className="mono" style={{ color: "#8B948E", fontSize: 10 }}>WEEKEND</div>
                          <div className="mono">{rate.hourRateWeekend != null ? rate.hourRateWeekend.toLocaleString() : "—"}</div>
                        </div>
                      </div>
                      {isAdmin && (
                        <div style={{ display: "flex", gap: 6, flexShrink: 0 }}>
                          <IconBtn onClick={() => openEditRate(rate)}><Pencil size={13} /></IconBtn>
                          <IconBtn onClick={() => setConfirmDeleteRate(rate.id)}><Trash2 size={13} /></IconBtn>
                        </div>
                      )}
                    </div>
                  ))}
                </div>
              ))}
            </div>
          )}
        </section>
        )}
      </div>

      {rateModalOpen && (
        <Modal onClose={() => setRateModalOpen(false)} narrow>
          <h2 style={{ margin: "0 0 18px", fontSize: 18, fontWeight: 700 }}>{editingRateId ? "Edit Rate" : "Add Rate"}</h2>
          <div style={{ display: "grid", gap: 14 }}>
            <Field label="Client" error={rateFieldErrors.client}>
              <select value={rateForm.client} onChange={e => setRateForm({ ...rateForm, client: e.target.value })}
                disabled={!!editingRateId}
                style={rateFieldErrors.client ? { ...selectStyle, border: "1px solid #F2545B", opacity: editingRateId ? 0.6 : 1 } : { ...selectStyle, opacity: editingRateId ? 0.6 : 1 }}>
                <option value="">Please select client</option>
                {clientsList.map(client => <option key={client} value={client}>{client}</option>)}
              </select>
            </Field>
            <Field label="Region" error={rateFieldErrors.region}>
              <select value={rateForm.region} onChange={e => setRateForm({ ...rateForm, region: e.target.value })}
                style={rateFieldErrors.region ? { ...selectStyle, border: "1px solid #F2545B", textTransform: "uppercase" } : { ...selectStyle, textTransform: "uppercase" }}>
                <option value="">Select a country</option>
                {COUNTRIES.map(country => <option key={country} value={country}>{country}</option>)}
              </select>
            </Field>
            <Field label="City" error={rateFieldErrors.city}>
              <TextInput value={rateForm.city} onChange={v => setRateForm({ ...rateForm, city: v })} placeholder="E.G. TOKYO" uppercase error={!!rateFieldErrors.city} />
            </Field>
            <Field label="Amount ($) per hour · Weekday Business Hours" error={rateFieldErrors.hourRateWeekdayBiz}>
              <input type="number" min="0" step="0.01" value={rateForm.hourRateWeekdayBiz}
                onChange={e => setRateForm({ ...rateForm, hourRateWeekdayBiz: e.target.value })}
                style={rateFieldErrors.hourRateWeekdayBiz ? { ...inputStyle, border: "1px solid #F2545B" } : inputStyle} />
            </Field>
            <Field label="Amount ($) per hour · Weekday After Office Hours" error={rateFieldErrors.hourRateWeekdayAfter}>
              <input type="number" min="0" step="0.01" value={rateForm.hourRateWeekdayAfter}
                onChange={e => setRateForm({ ...rateForm, hourRateWeekdayAfter: e.target.value })}
                style={rateFieldErrors.hourRateWeekdayAfter ? { ...inputStyle, border: "1px solid #F2545B" } : inputStyle} />
            </Field>
            <Field label="Amount ($) per hour · Weekend" error={rateFieldErrors.hourRateWeekend}>
              <input type="number" min="0" step="0.01" value={rateForm.hourRateWeekend}
                onChange={e => setRateForm({ ...rateForm, hourRateWeekend: e.target.value })}
                style={rateFieldErrors.hourRateWeekend ? { ...inputStyle, border: "1px solid #F2545B" } : inputStyle} />
            </Field>
            {rateSaveError && <div style={{ color: "#F2545B", fontSize: 12.5 }}>{rateSaveError}</div>}
          </div>
          <div style={{ display: "flex", gap: 10, marginTop: 22 }}>
            <button onClick={saveRateForm} disabled={saving} style={{ flex: 1, background: "#4ADE9C", color: "#0B0E0C", border: "none", borderRadius: 8, padding: "11px 0", fontWeight: 600, fontSize: 14, opacity: saving ? 0.6 : 1 }}>
              {saving ? "Saving…" : editingRateId ? "Save changes" : "Add rate"}
            </button>
            <button onClick={() => setRateModalOpen(false)} disabled={saving} style={{ background: "transparent", color: "#8B948E", border: "1px solid #262B27", borderRadius: 8, padding: "11px 18px", fontSize: 14 }}>Cancel</button>
          </div>
        </Modal>
      )}

      {confirmDeleteRate && (
        <Modal onClose={() => setConfirmDeleteRate(null)} narrow>
          <h2 style={{ margin: "0 0 10px", fontSize: 16, fontWeight: 700 }}>Delete this rate?</h2>
          <p style={{ color: "#8B948E", fontSize: 13, margin: "0 0 20px" }}>This removes the client's rate card entry. This can't be undone.</p>
          <div style={{ display: "flex", gap: 10 }}>
            <button onClick={() => deleteRate(confirmDeleteRate)} disabled={saving} style={{ flex: 1, background: "#F2545B", color: "#0B0E0C", border: "none", borderRadius: 8, padding: "11px 0", fontWeight: 600, fontSize: 14, opacity: saving ? 0.6 : 1 }}>
              {saving ? "Deleting…" : "Delete"}
            </button>
            <button onClick={() => setConfirmDeleteRate(null)} disabled={saving} style={{ background: "transparent", color: "#8B948E", border: "1px solid #262B27", borderRadius: 8, padding: "11px 18px", fontSize: 14 }}>Cancel</button>
          </div>
        </Modal>
      )}

      {manageUsersOpen && (
        <Modal onClose={() => setManageUsersOpen(false)}>
          <h2 style={{ margin: "0 0 6px", fontSize: 18, fontWeight: 700 }}>Manage Users</h2>
          <p style={{ color: "#8B948E", fontSize: 13, margin: "0 0 16px" }}>Assign anyone who registered to Admin or Guest.</p>

          <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", gap: 10, padding: "10px 12px", border: "1px solid #1E2320", borderRadius: 8, marginBottom: 10 }}>
            <div>
              <div style={{ fontWeight: 700, fontSize: 14 }}>{fullName(currentUser)} (you)</div>
              <div className="mono" style={{ fontSize: 10.5, color: "#4ADE9C" }}>SUPER ADMIN</div>
            </div>
          </div>

          {users.filter(u => u.role !== "superadmin").length === 0 ? (
            <EmptyRow text="No other registered users yet." />
          ) : (
            <div style={{ display: "grid", gap: 8, maxHeight: 360, overflowY: "auto" }} className="scrollbar">
              {users.filter(u => u.role !== "superadmin").map(u => (
                <div key={u.id} style={{ display: "flex", alignItems: "center", justifyContent: "space-between", gap: 10, padding: "10px 12px", border: "1px solid #1E2320", borderRadius: 8, flexWrap: "wrap" }}>
                  <div>
                    <div style={{ fontWeight: 700, fontSize: 14 }}>{fullName(u)}</div>
                    <div className="mono" style={{ fontSize: 10.5, color: ROLE_COLOR[u.role] }}>{ROLE_LABEL[u.role].toUpperCase()}</div>
                  </div>
                  <div style={{ display: "flex", gap: 6, flexShrink: 0 }}>
                    {u.role !== "admin" && (
                      <button onClick={() => setUserRole(u.id, "admin")} style={{ background: "transparent", border: "1px solid #6E9FB055", borderRadius: 6, padding: "6px 10px", color: "#6E9FB0", fontSize: 11.5, fontWeight: 600 }}>Make Admin</button>
                    )}
                    {u.role !== "guest" && (
                      <button onClick={() => setUserRole(u.id, "guest")} style={{ background: "transparent", border: "1px solid #262B27", borderRadius: 6, padding: "6px 10px", color: "#8B948E", fontSize: 11.5, fontWeight: 600 }}>Make Guest</button>
                    )}
                  </div>
                </div>
              ))}
            </div>
          )}

          <div style={{ display: "flex", gap: 10, marginTop: 20 }}>
            <button onClick={() => setManageUsersOpen(false)} style={{ flex: 1, background: "transparent", color: "#8B948E", border: "1px solid #262B27", borderRadius: 8, padding: "11px 0", fontSize: 14 }}>Close</button>
          </div>
        </Modal>
      )}

      {activityLogOpen && (
        <Modal onClose={() => setActivityLogOpen(false)}>
          <h2 style={{ margin: "0 0 6px", fontSize: 18, fontWeight: 700 }}>Activity Log</h2>
          <p style={{ color: "#8B948E", fontSize: 13, margin: "0 0 16px" }}>Full activity, visible to Super Admin only.</p>
          {activity.length === 0 ? (
            <EmptyRow text="No activity recorded yet." />
          ) : (
            <div style={{ display: "grid", gap: 8, maxHeight: 440, overflowY: "auto" }} className="scrollbar">
              {[...activity].reverse().map(a => (
                <div key={a.id} style={{ padding: "10px 12px", border: "1px solid #1E2320", borderRadius: 8 }}>
                  <div style={{ display: "flex", justifyContent: "space-between", gap: 10 }}>
                    <span style={{ fontWeight: 700, fontSize: 13 }}>{a.name}</span>
                    <span className="mono" style={{ fontSize: 10.5, color: "#8B948E", flexShrink: 0 }}>{fmtDateTime(a.ts)}</span>
                  </div>
                  <div className="mono" style={{ fontSize: 10, color: ROLE_COLOR[a.role] || "#8B948E", marginTop: 2 }}>{(ROLE_LABEL[a.role] || a.role || "").toUpperCase()}</div>
                  <div style={{ fontSize: 12.5, color: "#E8ECE9", marginTop: 4 }}>{a.detail}</div>
                </div>
              ))}
            </div>
          )}
          <div style={{ display: "flex", gap: 10, marginTop: 20 }}>
            <button onClick={() => setActivityLogOpen(false)} style={{ flex: 1, background: "transparent", color: "#8B948E", border: "1px solid #262B27", borderRadius: 8, padding: "11px 0", fontSize: 14 }}>Close</button>
          </div>
        </Modal>
      )}

      {rateChooserOpen && (
        <Modal onClose={() => setRateChooserOpen(false)} narrow>
          <h2 style={{ margin: "0 0 10px", fontSize: 16, fontWeight: 700 }}>Edit Rate Card</h2>
          <p style={{ color: "#8B948E", fontSize: 13, margin: "0 0 16px" }}>Pick a client + city to update their rates, or add a new one.</p>
          <button onClick={() => { setRateChooserOpen(false); openAddRate(); }}
            style={{ display: "flex", alignItems: "center", justifyContent: "center", gap: 8, width: "100%", background: "transparent", color: "#4ADE9C", border: "1px solid #4ADE9C55", borderRadius: 8, padding: "12px 14px", fontWeight: 600, fontSize: 14, marginBottom: 14 }}>
            <Plus size={16} /> Add Rate
          </button>
          {rateCard.length === 0 ? (
            <div className="mono" style={{ fontSize: 12, color: "#8B948E", lineHeight: 1.6 }}>
              No rate card entries yet. Use Add Rate above, or Top Up Tokens → New Client to set one up.
            </div>
          ) : (
            <div style={{ display: "grid", gap: 8 }}>
              {rateCard.map(rate => (
                <button key={rate.id} onClick={() => { setRateChooserOpen(false); openEditRate(rate); }}
                  style={{ display: "flex", alignItems: "center", justifyContent: "space-between", gap: 10, background: "transparent", border: "1px solid #262B27", borderRadius: 8, padding: "12px 14px", color: "#E8ECE9", fontSize: 14, fontWeight: 600, textAlign: "left" }}>
                  {rate.client} — {rate.city}
                  <Pencil size={13} color="#8B948E" />
                </button>
              ))}
            </div>
          )}
          <div style={{ display: "flex", gap: 10, marginTop: 18 }}>
            <button onClick={() => setRateChooserOpen(false)} style={{ flex: 1, background: "transparent", color: "#8B948E", border: "1px solid #262B27", borderRadius: 8, padding: "11px 18px", fontSize: 14 }}>Close</button>
          </div>
        </Modal>
      )}

      {topUpModalOpen && (
        <Modal onClose={() => setTopUpModalOpen(false)} narrow>
          <h2 style={{ margin: "0 0 18px", fontSize: 18, fontWeight: 700 }}>Token Top-Up</h2>
          <div style={{ display: "grid", gap: 14 }}>
            <Field label="Top up for">
              <div style={{ display: "flex", gap: 8 }}>
                <button type="button" className="type-btn" onClick={() => { setTopUpMode("existing"); setTopUpError(""); }}
                  style={{
                    flex: 1, padding: "12px 0", borderRadius: 8, fontWeight: 600, fontSize: 14,
                    border: topUpMode === "existing" ? "1px solid #6E9FB0" : "1px solid #262B27",
                    background: topUpMode === "existing" ? "#6E9FB022" : "transparent",
                    color: topUpMode === "existing" ? "#6E9FB0" : "#8B948E"
                  }}>Existing Client</button>
                <button type="button" className="type-btn" onClick={() => { setTopUpMode("new"); setTopUpError(""); }}
                  style={{
                    flex: 1, padding: "12px 0", borderRadius: 8, fontWeight: 600, fontSize: 14,
                    border: topUpMode === "new" ? "1px solid #4ADE9C" : "1px solid #262B27",
                    background: topUpMode === "new" ? "#4ADE9C22" : "transparent",
                    color: topUpMode === "new" ? "#4ADE9C" : "#8B948E"
                  }}>New Client</button>
              </div>
            </Field>

            {topUpMode === "new" ? (
              <div className="mono" style={{ fontSize: 12, color: "#8B948E", lineHeight: 1.6 }}>
                This opens the Add Request form, pre-set to Token, so you can set up the new client's first batch of tokens.
              </div>
            ) : (
              <React.Fragment>
                {requests.filter(isTokenAccount).length === 0 ? (
                  <div className="mono" style={{ fontSize: 12, color: "#8B948E" }}>No token requests on file yet — start with a new client instead.</div>
                ) : (
                  <React.Fragment>
                    <Field label="Client / request">
                      <select value={topUpRequestId} onChange={e => { setTopUpRequestId(e.target.value); setTopUpError(""); }} style={selectStyle}>
                        <option value="">Please select a request</option>
                        {requests.filter(isTokenAccount).map(r => (
                          <option key={r.id} value={r.id}>{r.client} · {r.refNo} (balance: ${r.tokenCount.toLocaleString()})</option>
                        ))}
                      </select>
                    </Field>
                    <Field label="Amount to top up ($)">
                      <input type="number" min="1" value={topUpAmount}
                        onChange={e => { setTopUpAmount(e.target.value); setTopUpError(""); }}
                        style={inputStyle} placeholder="E.G. 5" />
                    </Field>
                  </React.Fragment>
                )}
              </React.Fragment>
            )}
            {topUpError && <div style={{ color: "#F2545B", fontSize: 11.5 }}>{topUpError}</div>}
          </div>

          <div style={{ display: "flex", gap: 10, marginTop: 22 }}>
            {topUpMode === "new" ? (
              <button onClick={goToNewClientTopUp} style={{ flex: 1, background: "#4ADE9C", color: "#0B0E0C", border: "none", borderRadius: 8, padding: "11px 0", fontWeight: 600, fontSize: 14 }}>
                Continue to Add Request
              </button>
            ) : (
              <button onClick={submitTopUp} disabled={saving || requests.filter(isTokenAccount).length === 0}
                style={{ flex: 1, background: "#4ADE9C", color: "#0B0E0C", border: "none", borderRadius: 8, padding: "11px 0", fontWeight: 600, fontSize: 14, opacity: (saving || requests.filter(isTokenAccount).length === 0) ? 0.5 : 1 }}>
                {saving ? "Saving…" : "Top up"}
              </button>
            )}
            <button onClick={() => setTopUpModalOpen(false)} disabled={saving} style={{ background: "transparent", color: "#8B948E", border: "1px solid #262B27", borderRadius: 8, padding: "11px 18px", fontSize: 14 }}>Cancel</button>
          </div>
        </Modal>
      )}

      {modalOpen && (() => {
        const editingAccount = editingId ? isTokenAccount(requests.find(r => r.id === editingId) || {}) : false;
        return (
        <Modal onClose={() => setModalOpen(false)}>
          <h2 style={{ margin: "0 0 18px", fontSize: 18, fontWeight: 700 }}>{editingId ? "Edit Request" : "Add Request"}</h2>
          <div style={{ display: "grid", gap: 14 }}>
            <Field label="Reference No." error={fieldErrors.refNo}>
              <TextInput value={form.refNo} onChange={v => setForm({ ...form, refNo: v })} placeholder="E.G. GVMS01234 / IN1234 / CS4321" uppercase error={!!fieldErrors.refNo} />
            </Field>
            <Field label="Region" error={fieldErrors.region}>
              <select value={form.region} onChange={e => setForm({ ...form, region: e.target.value })}
                style={fieldErrors.region ? { ...selectStyle, border: "1px solid #F2545B", textTransform: "uppercase" } : { ...selectStyle, textTransform: "uppercase" }}>
                <option value="">Select a country</option>
                {COUNTRIES.map(country => <option key={country} value={country}>{country}</option>)}
              </select>
            </Field>
            <Field label="Client" error={fieldErrors.client}>
              {includeRateInputs ? (
                <React.Fragment>
                  <TextInput value={form.client} onChange={v => setForm({ ...form, client: v })} placeholder="ENTER NEW CLIENT NAME" uppercase error={!!fieldErrors.client} />
                  <div className="mono" style={{ fontSize: 10.5, color: "#8B948E", marginTop: 6 }}>
                    New client — this will be added to the client list once saved.
                  </div>
                </React.Fragment>
              ) : form.type === "adhoc" ? (
                <ClientSelect value={form.client} onChange={v => setForm({ ...form, client: v, city: "" })}
                  options={clientsList} error={!!fieldErrors.client} />
              ) : (
                <select value={form.client} onChange={e => setForm({ ...form, client: e.target.value, city: "" })}
                  style={fieldErrors.client ? { ...selectStyle, border: "1px solid #F2545B" } : selectStyle}>
                  <option value="">Please select client</option>
                  {clientsList.map(client => <option key={client} value={client}>{client}</option>)}
                </select>
              )}
            </Field>
            {!includeRateInputs && form.type === "token" && (
              <Field label="City" error={fieldErrors.city}>
                <CitySelect value={form.city} onChange={v => setForm({ ...form, city: v })} options={allCities(rateCard)}
                  error={!!fieldErrors.city} />
                <div className="mono" style={{ fontSize: 10.5, color: "#8B948E", marginTop: 6 }}>
                  Rate is matched by client + city.
                </div>
              </Field>
            )}
            <Field label="Site Address" error={fieldErrors.address}>
              <TextInput value={form.address} onChange={v => setForm({ ...form, address: v })} placeholder="E.G. XYZ STREET 12" uppercase error={!!fieldErrors.address} />
            </Field>
            <Field label="Description">
              <textarea value={form.scope} onChange={e => setForm({ ...form, scope: e.target.value.toUpperCase() })}
                placeholder="DESCRIBE THE JOB / SCOPE OF WORK"
                rows={3} style={{ ...inputStyle, resize: "vertical", fontFamily: "'Space Grotesk', sans-serif" }} />
            </Field>

            <Field label="Request type">
              <div style={{ display: "flex", gap: 8 }}>
                <button type="button" className="type-btn" onClick={() => setForm({ ...form, type: "adhoc", city: "" })}
                  style={{
                    flex: 1, padding: "12px 0", borderRadius: 8, fontWeight: 600, fontSize: 14,
                    border: form.type === "adhoc" ? "1px solid #4ADE9C" : "1px solid #262B27",
                    background: form.type === "adhoc" ? "#4ADE9C22" : "transparent",
                    color: form.type === "adhoc" ? "#4ADE9C" : "#8B948E"
                  }}>Adhoc</button>
                <button type="button" className="type-btn" onClick={() => setForm({ ...form, type: "token" })}
                  style={{
                    flex: 1, padding: "12px 0", borderRadius: 8, fontWeight: 600, fontSize: 14,
                    border: form.type === "token" ? "1px solid #6E9FB0" : "1px solid #262B27",
                    background: form.type === "token" ? "#6E9FB022" : "transparent",
                    color: form.type === "token" ? "#6E9FB0" : "#8B948E"
                  }}>Token</button>
              </div>
            </Field>

            {includeRateInputs && (
              <div style={{ border: "1px solid #4ADE9C33", borderRadius: 10, padding: 14, display: "grid", gap: 12 }}>
                <div className="mono" style={{ fontSize: 11, color: "#4ADE9C", letterSpacing: 0.5 }}>RATE CARD FOR THIS CLIENT + CITY</div>
                <div className="mono" style={{ fontSize: 10.5, color: "#8B948E", marginTop: -6 }}>
                  Optional — fill in whichever hourly rates apply. This saves straight to the Rate Card.
                </div>
                <Field label="City" error={fieldErrors.city}>
                  <TextInput value={form.city} onChange={v => setForm({ ...form, city: v })} placeholder="E.G. TOKYO" uppercase error={!!fieldErrors.city} />
                </Field>
                <Field label="Amount ($) per hour · Weekday Business Hours" error={rateInputErrors.hourRateWeekdayBiz}>
                  <input type="number" min="0" step="0.01" value={rateInputs.hourRateWeekdayBiz}
                    onChange={e => setRateInputs({ ...rateInputs, hourRateWeekdayBiz: e.target.value })}
                    style={rateInputErrors.hourRateWeekdayBiz ? { ...inputStyle, border: "1px solid #F2545B" } : inputStyle} />
                </Field>
                <Field label="Amount ($) per hour · Weekday After Office Hours" error={rateInputErrors.hourRateWeekdayAfter}>
                  <input type="number" min="0" step="0.01" value={rateInputs.hourRateWeekdayAfter}
                    onChange={e => setRateInputs({ ...rateInputs, hourRateWeekdayAfter: e.target.value })}
                    style={rateInputErrors.hourRateWeekdayAfter ? { ...inputStyle, border: "1px solid #F2545B" } : inputStyle} />
                </Field>
                <Field label="Amount ($) per hour · Weekend" error={rateInputErrors.hourRateWeekend}>
                  <input type="number" min="0" step="0.01" value={rateInputs.hourRateWeekend}
                    onChange={e => setRateInputs({ ...rateInputs, hourRateWeekend: e.target.value })}
                    style={rateInputErrors.hourRateWeekend ? { ...inputStyle, border: "1px solid #F2545B" } : inputStyle} />
                </Field>
                <Field label="Starting Amount ($)" error={fieldErrors.tokenCount}>
                  <input type="number" min="1" value={form.tokenCount}
                    onChange={e => setForm({ ...form, tokenCount: e.target.value })}
                    style={fieldErrors.tokenCount ? { ...inputStyle, border: "1px solid #F2545B" } : inputStyle} />
                </Field>
              </div>
            )}

            {!includeRateInputs && (
              <Field label="Request date" error={fieldErrors.requestDate}>
                <TextInput type="date" value={form.requestDate} onChange={v => setForm({ ...form, requestDate: v })} error={!!fieldErrors.requestDate} />
              </Field>
            )}
            {editingAccount && (
              <Field label="Balance ($)" error={fieldErrors.tokenCount}>
                <input type="number" min="0" value={form.tokenCount} disabled={!isSuperAdmin}
                  onChange={e => setForm({ ...form, tokenCount: e.target.value })}
                  style={fieldErrors.tokenCount ? { ...inputStyle, border: "1px solid #F2545B" } : { ...inputStyle, opacity: isSuperAdmin ? 1 : 0.6, cursor: isSuperAdmin ? "text" : "not-allowed" }} />
                {!isSuperAdmin && (
                  <div className="mono" style={{ fontSize: 10.5, color: "#8B948E", marginTop: 6 }}>
                    Only Super Admin can adjust this balance directly. Use Top Up Tokens to add to it.
                  </div>
                )}
              </Field>
            )}
            {!includeRateInputs && !editingAccount && (
              <div style={{ display: "flex", gap: 10 }}>
                <div style={{ flex: 1 }}>
                  <Field label="Start time" error={fieldErrors.startTime}>
                    <HourSelect value={form.startTime} onChange={v => setForm({ ...form, startTime: v })} error={!!fieldErrors.startTime} />
                  </Field>
                </div>
                <div style={{ flex: 1 }}>
                  <Field label="End time" error={fieldErrors.endTime}>
                    <HourSelect value={form.endTime} onChange={v => setForm({ ...form, endTime: v })} error={!!fieldErrors.endTime} />
                  </Field>
                </div>
              </div>
            )}
            {!includeRateInputs && !editingAccount && form.type === "token" && (() => {
              const tier = deriveHourTier(form.requestDate, form.startTime);
              const hours = hoursBetween(form.startTime, form.endTime);
              if (!tier || hours == null) return (
                <div className="mono" style={{ fontSize: 10.5, color: "#8B948E" }}>
                  Fill in start and end time to see the rate tier and estimated cost.
                </div>
              );
              const tierInfo = HOUR_TIERS.find(t => t.value === tier) || HOUR_TIERS[0];
              const matched = findRate(rateCard, form.client, form.city);
              const rate = matched ? matched[tierInfo.rateField] : null;
              const cost = rate != null ? Math.round(rate * hours * 100) / 100 : null;
              const accountKey = form.client.trim().toLowerCase() + "|" + form.city.trim().toLowerCase();
              const account = requests.find(a => isTokenAccount(a) && a.client.trim().toLowerCase() + "|" + (a.city || "").trim().toLowerCase() === accountKey);
              const isPast = form.requestDate < todayStr();
              return (
                <div className="mono" style={{ fontSize: 10.5, color: "#6E9FB0" }}>
                  <div>
                    {tierInfo.label} · {hours}h
                    {rate != null
                      ? ` · rate on file: $${rate}/hr · est. $${cost.toLocaleString()} total`
                      : " · no rate on file for this client/city + tier — nothing will be deducted."}
                  </div>
                  {cost != null && (
                    <div style={{ marginTop: 3, color: "#4ADE9C" }}>
                      {!account
                        ? `No Active Tokens account for ${form.client} · ${form.city} yet — nothing will be deducted until one exists.`
                        : isPast
                          ? `Will deduct $${cost.toLocaleString()} from ${form.client}'s balance (currently $${(account.tokenCount || 0).toLocaleString()}) shortly after saving.`
                          : `Deducts $${cost.toLocaleString()} from ${form.client}'s balance (currently $${(account.tokenCount || 0).toLocaleString()}) once ${fmtShort(form.requestDate)} has passed.`}
                    </div>
                  )}
                </div>
              );
            })()}
            {formSaveError && <div style={{ color: "#F2545B", fontSize: 12.5 }}>{formSaveError}</div>}
          </div>

          <div style={{ display: "flex", gap: 10, marginTop: 22 }}>
            <button onClick={saveForm} disabled={saving} style={{ flex: 1, background: "#4ADE9C", color: "#0B0E0C", border: "none", borderRadius: 8, padding: "11px 0", fontWeight: 600, fontSize: 14, opacity: saving ? 0.6 : 1 }}>
              {saving ? "Saving…" : editingId ? "Save changes" : "Add request"}
            </button>
            <button onClick={() => setModalOpen(false)} disabled={saving} style={{ background: "transparent", color: "#8B948E", border: "1px solid #262B27", borderRadius: 8, padding: "11px 18px", fontSize: 14 }}>Cancel</button>
          </div>
        </Modal>
        );
      })()}

      {confirmDelete && (
        <Modal onClose={() => setConfirmDelete(null)} narrow>
          <h2 style={{ margin: "0 0 10px", fontSize: 16, fontWeight: 700 }}>Delete this request?</h2>
          <p style={{ color: "#8B948E", fontSize: 13, margin: "0 0 20px" }}>This removes the request and its visit history. This can't be undone.</p>
          <div style={{ display: "flex", gap: 10 }}>
            <button onClick={() => deleteRequest(confirmDelete)} disabled={saving} style={{ flex: 1, background: "#F2545B", color: "#0B0E0C", border: "none", borderRadius: 8, padding: "11px 0", fontWeight: 600, fontSize: 14, opacity: saving ? 0.6 : 1 }}>
              {saving ? "Deleting…" : "Delete"}
            </button>
            <button onClick={() => setConfirmDelete(null)} disabled={saving} style={{ background: "transparent", color: "#8B948E", border: "1px solid #262B27", borderRadius: 8, padding: "11px 18px", fontSize: 14 }}>Cancel</button>
          </div>
        </Modal>
      )}
    </div>
  );
}

function StatBox({ label, value, color }) {
  return (
    <div style={{ background: "#0E1210", border: "1px solid #1E2320", borderRadius: 10, padding: "14px 16px" }}>
      <div className="mono" style={{ fontSize: 10, letterSpacing: 1.5, color: "#8B948E", marginBottom: 6 }}>{label}</div>
      <div className="mono" style={{ fontSize: 26, fontWeight: 700, color }}>{value}</div>
    </div>
  );
}
function SectionHeader({ title, sub }) {
  return (
    <div style={{ display: "flex", alignItems: "baseline", gap: 10, marginBottom: 14 }}>
      <h2 style={{ fontSize: 17, fontWeight: 700, margin: 0 }}>{title}</h2>
      <span className="mono" style={{ fontSize: 11, color: "#8B948E" }}>{sub}</span>
    </div>
  );
}
function EmptyRow({ text }) {
  return <div style={{ border: "1px dashed #262B27", borderRadius: 10, padding: "28px 20px", textAlign: "center", color: "#8B948E", fontSize: 13 }}>{text}</div>;
}

function RequestCard({ r, isAdmin, onEdit, onDelete }) {
  const complete = r.remaining === 0;
  const ledColor = r.overdueCount > 0 ? "#F2545B" : r.dueSoonCount > 0 ? "#F5A623" : "#4ADE9C";
  const isToken = r.type === "token";
  const isAccount = isTokenAccount(r);

  return (
    <div style={{ background: "#0E1210", border: "1px solid #1E2320", borderRadius: 12, padding: "16px 18px", position: "relative" }}>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", gap: 10 }}>
        <div style={{ display: "flex", gap: 10, minWidth: 0 }}>
          <div className="jack jack-glow" style={{ background: ledColor, color: ledColor, marginTop: 6 }} />
          <div style={{ minWidth: 0 }}>
            <div style={{ fontWeight: 700, fontSize: 15, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{r.client || "Untitled client"}</div>
            <div className="mono" style={{ fontSize: 11, color: "#8B948E" }}>{r.refNo}</div>
          </div>
        </div>
        <div style={{ display: "flex", gap: 6, flexShrink: 0 }}>
          {isAdmin && (
            <React.Fragment>
              <IconBtn onClick={onEdit}><Pencil size={13} /></IconBtn>
              <IconBtn onClick={onDelete}><Trash2 size={13} /></IconBtn>
            </React.Fragment>
          )}
        </div>
      </div>

      <div style={{ fontSize: 12.5, color: "#8B948E", margin: "10px 0", lineHeight: 1.5 }}>
        {r.address || "No address specified"}
        {r.city && <span className="mono" style={{ color: "#4ADE9C" }}> · {r.city.toUpperCase()}</span>}
        {r.region && <span className="mono" style={{ color: "#6E9FB0" }}> · {r.region.toUpperCase()}</span>}
      </div>
      {isAccount ? (
        <div style={{ display: "flex", alignItems: "center", gap: 5, margin: "-4px 0 10px", color: "#4ADE9C", fontSize: 11.5, fontWeight: 600 }}>
          <span className="jack jack-glow" style={{ background: "#4ADE9C", color: "#4ADE9C", width: 6, height: 6 }} /> ACTIVE TOKEN
        </div>
      ) : r.scope && (
        <div style={{ fontSize: 12, color: "#8B948E", margin: "-4px 0 10px", lineHeight: 1.5, fontStyle: "italic" }}>
          {r.scope}
        </div>
      )}

      <div style={{ display: "flex", gap: 16, fontSize: 12 }}>
        <div>
          <div className="mono" style={{ color: "#8B948E", fontSize: 10 }}>TYPE</div>
          <div className="mono" style={{ display: "flex", alignItems: "center", gap: 5, color: isToken ? "#6E9FB0" : "#4ADE9C" }}>
            <Ticket size={12} /> {isToken
              ? `TOKEN${r.hourTier ? " · " + (HOUR_TIERS.find(t => t.value === r.hourTier) || HOUR_TIERS[0]).label.toUpperCase() : ""}`
              : "ADHOC"}
          </div>
        </div>
        <div>
          <div className="mono" style={{ color: "#8B948E", fontSize: 10 }}>REQUESTED</div>
          <div className="mono">{fmtShort(r.requestDate)}</div>
        </div>
        {(r.startTime || r.endTime) && (
          <div>
            <div className="mono" style={{ color: "#8B948E", fontSize: 10 }}>TIME</div>
            <div className="mono">{r.startTime || "?"} – {r.endTime || "?"}</div>
          </div>
        )}
        {isAccount && (
          <div>
            <div className="mono" style={{ color: "#8B948E", fontSize: 10 }}>BALANCE</div>
            <div className="mono" style={{ color: "#4ADE9C" }}>${r.tokenCount.toLocaleString()}</div>
          </div>
        )}
        {isToken && !isAccount && (
          <div>
            <div className="mono" style={{ color: "#8B948E", fontSize: 10 }}>DEDUCTION</div>
            <div className="mono" style={{ color: r.deductionApplied ? "#4ADE9C" : "#F5A623" }}>
              {r.deductionApplied
                ? (r.deductedAmount > 0 ? `-$${r.deductedAmount.toLocaleString()} applied` : "None")
                : (r.estCost != null ? `Pending · est. $${r.estCost.toLocaleString()}` : "Pending")}
            </div>
          </div>
        )}
      </div>

      {r.overdueCount > 0 && (
        <div style={{ display: "flex", alignItems: "center", gap: 6, marginTop: 10, color: "#F2545B", fontSize: 11 }}>
          <AlertTriangle size={12} /> {r.overdueCount} visit{r.overdueCount > 1 ? "s" : ""} overdue
        </div>
      )}
      {r.overdueCount === 0 && r.dueSoonCount > 0 && (
        <div style={{ display: "flex", alignItems: "center", gap: 6, marginTop: 10, color: "#F5A623", fontSize: 11 }}>
          <Clock size={12} /> {r.dueSoonCount} visit{r.dueSoonCount > 1 ? "s" : ""} due soon
        </div>
      )}

    </div>
  );
}

function IconBtn({ children, onClick }) {
  return <button onClick={onClick} style={{ background: "transparent", border: "1px solid #262B27", borderRadius: 6, padding: 6, color: "#8B948E", display: "flex" }}>{children}</button>;
}
function Modal({ children, onClose, narrow }) {
  return (
    <div onClick={onClose} style={{ position: "fixed", inset: 0, background: "rgba(0,0,0,0.6)", display: "flex", alignItems: "center", justifyContent: "center", padding: 20, zIndex: 50 }}>
      <div onClick={e => e.stopPropagation()} className="scrollbar" style={{ background: "#0E1210", border: "1px solid #262B27", borderRadius: 14, padding: 24, width: "100%", maxWidth: narrow ? 380 : 460, maxHeight: "90vh", overflowY: "auto" }}>
        <div style={{ display: "flex", justifyContent: "flex-end" }}>
          <button onClick={onClose} style={{ background: "none", border: "none", color: "#8B948E", marginTop: -8, marginRight: -8 }}><XIcon size={18} /></button>
        </div>
        <div style={{ marginTop: -28 }}>{children}</div>
      </div>
    </div>
  );
}
function Field({ label, children, error }) {
  return (
    <div>
      <label className="mono" style={{ fontSize: 11, color: error ? "#F2545B" : "#8B948E", display: "block", marginBottom: 6, letterSpacing: 0.5 }}>{label.toUpperCase()}</label>
      {children}
      {error && <div style={{ color: "#F2545B", fontSize: 11.5, marginTop: 5 }}>{error}</div>}
    </div>
  );
}
const inputStyle = { width: "100%", background: "#0B0E0C", border: "1px solid #262B27", borderRadius: 7, padding: "10px 12px", color: "#E8ECE9", fontSize: 14, outline: "none", colorScheme: "dark" };
const selectStyle = { ...inputStyle, appearance: "auto" };

function ClientSelect({ value, onChange, options, error }) {
  const [newMode, setNewMode] = React.useState(false);
  const known = options.includes(value);
  const isNew = newMode || (!!value && !known);
  return (
    <div>
      <select value={isNew ? "__new__" : (known ? value : "")}
        onChange={e => {
          const v = e.target.value;
          if (v === "__new__") { setNewMode(true); onChange(""); }
          else { setNewMode(false); onChange(v); }
        }}
        style={error ? { ...selectStyle, border: "1px solid #F2545B" } : selectStyle}>
        <option value="">Please select client</option>
        {options.map(c => <option key={c} value={c}>{c}</option>)}
        <option value="__new__">+ New Client</option>
      </select>
      {isNew && (
        <div style={{ marginTop: 8 }}>
          <TextInput value={value} onChange={onChange} placeholder="ENTER CLIENT NAME" uppercase error={error} />
          <div className="mono" style={{ fontSize: 10.5, color: "#8B948E", marginTop: 6 }}>
            One-off client for this request — won't be added to the Token client list.
          </div>
        </div>
      )}
    </div>
  );
}
const HOUR_OPTIONS = Array.from({ length: 24 }, (_, h) => {
  const period = h < 12 ? "AM" : "PM";
  const displayHour = (h % 12) || 12;
  return { value: String(h).padStart(2, "0") + ":00", label: `${displayHour}:00 ${period}` };
});
function HourSelect({ value, onChange, error }) {
  return (
    <select value={value} onChange={e => onChange(e.target.value)}
      style={error ? { ...selectStyle, border: "1px solid #F2545B" } : selectStyle}>
      <option value="">Select hour</option>
      {HOUR_OPTIONS.map(h => <option key={h.value} value={h.value}>{h.label}</option>)}
    </select>
  );
}
function CitySelect({ value, onChange, options, error }) {
  return (
    <select value={value} onChange={e => onChange(e.target.value)}
      style={error ? { ...selectStyle, border: "1px solid #F2545B", textTransform: "uppercase" } : { ...selectStyle, textTransform: "uppercase" }}>
      <option value="">Select a city</option>
      {options.map(c => <option key={c} value={c}>{c}</option>)}
    </select>
  );
}
function TextInput({ value, onChange, placeholder, type = "text", uppercase = false, error = false }) {
  const base = uppercase ? { ...inputStyle, textTransform: "uppercase" } : inputStyle;
  const withCursor = type === "date" ? { ...base, cursor: "pointer" } : base;
  return (
    <input type={type} value={value} onChange={e => onChange(uppercase ? e.target.value.toUpperCase() : e.target.value)}
      onClick={e => { if (type === "date" && e.target.showPicker) { try { e.target.showPicker(); } catch (err) {} } }}
      placeholder={placeholder} style={error ? { ...withCursor, border: "1px solid #F2545B" } : withCursor} />
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<Dashboard />);
</script>
</body>
</html>
