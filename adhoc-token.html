const MS_DAY = 86400000;
const todayStr = () => new Date().toISOString().slice(0, 10);

const fmtShort = s => parseD(s).toLocaleDateString("en-US", { month: "short", day: "numeric", year: "numeric" });
const daysBetween = (a, b) => Math.round((b - a) / MS_DAY);

function slotStatus(slot) {
  if (slot.completed) return "done";
  if (!slot.date) return "unselected";
  const today = parseD(todayStr());
  const d = parseD(slot.date);
  const diff = daysBetween(today, d);
  if (diff < 0) return "overdue";
  if (diff <= 30) return "due-soon";
  return "scheduled";
}

function slotCountFor(form) {
  return 1; // one schedulable visit slot per request (adhoc or a token job-request)
}
function buildSlots(form, existing = [], isAccount = false) {
  if (isAccount) return []; // an Active Tokens account isn't a job, no scheduling
  const count = slotCountFor(form);
  const out = [];
  for (let i = 0; i < count; i++) {
    out.push(existing[i] ? existing[i] : { id: uid(), date: form.requestDate || null, completed: false });
  }
  return out;
}

function csvEscape(val) {
  const s = val == null ? "" : String(val);
  return /[",\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s;
}
function toCsv(rows) {
  return rows.map(row => row.map(csvEscape).join(",")).join("\r\n");
}
function downloadCsv(filename, rows) {
  const blob = new Blob([toCsv(rows)], { type: "text/csv;charset=utf-8;" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function findRate(rateCard, client, city) {
  if (!client || !city) return null;
  const cNeedle = client.trim().toLowerCase();
  const tNeedle = city.trim().toLowerCase();
  return rateCard.find(r => r.client.trim().toLowerCase() === cNeedle && (r.city || "").trim().toLowerCase() === tNeedle) || null;

const BUSINESS_HOURS_START = "09:00";
const BUSINESS_HOURS_END = "18:00";
function deriveHourTier(requestDate, startTime) {
  if (!requestDate || !startTime) return null;
  const day = parseD(requestDate).getDay(); // 0 = Sun, 6 = Sat
  if (day === 0 || day === 6) return "weekend";
  return (startTime >= BUSINESS_HOURS_START && startTime < BUSINESS_HOURS_END) ? "weekday_biz" : "weekday_after";
}
function hoursBetween(startTime, endTime) {
  if (!startTime || !endTime) return null;
  const [sh, sm] = startTime.split(":").map(Number);
  const [eh, em] = endTime.split(":").map(Number);
  const mins = (eh * 60 + em) - (sh * 60 + sm);
  return mins > 0 ? mins / 60 : null;
}
// a token request is an "account" (Active Tokens) only from the new-client flow, not a
// regular Add Request (which is a job, even for Token type). Legacy rows saved before this
// flag existed never had Start/End Time either, so treat those as accounts too.
function isTokenAccount(r) {
  if (r.type !== "token") return false;
  if (typeof r.isAccount === "boolean") return r.isAccount;
  return !r.startTime && !r.endTime;
}
// computes the dollar cost (hours x the matching rate-card hourly rate) a token job-request
// would deduct, without applying it. Returns null when it can't be computed yet.
function computeJobCost(r, rateCard) {
  const hrs = hoursBetween(r.startTime, r.endTime);
  if (hrs == null) return null;
  const tier = deriveHourTier(r.requestDate, r.startTime);
  const tierInfo = HOUR_TIERS.find(t => t.value === tier) || HOUR_TIERS[0];
  const matched = findRate(rateCard, r.client, r.city);
  const rate = matched ? matched[tierInfo.rateField] : null;
  if (rate == null) return null;
  return Math.round(rate * hrs * 100) / 100;
}
// finds every token job-request whose Request Date has fully passed and hasn't had its
// deduction applied yet, and subtracts its dollar cost from the matching client+city
// Active Tokens account balance. Requests with no computable cost yet (missing hours) are
// marked applied with $0 so they don't get re-checked forever; requests missing a rate or a
// matching account are left pending so a later sweep can pick them up once one exists.
function sweepMaturedDeductions(requests, rateCard) {
  const today = todayStr();
  const accountIndexByKey = new Map();
  requests.forEach((r, i) => {
    if (isTokenAccount(r)) {
      const key = r.client.trim().toLowerCase() + "|" + (r.city || "").trim().toLowerCase();
      if (!accountIndexByKey.has(key)) accountIndexByKey.set(key, i);
    }
  });
  const deltas = new Map();
  const applied = [];
  let changed = false;
  const updated = requests.map(r => {
    if (r.type !== "token" || isTokenAccount(r) || r.deductionApplied || !(r.requestDate < today)) return r;
    const hrs = hoursBetween(r.startTime, r.endTime);
    if (hrs == null) { changed = true; return { ...r, deductionApplied: true, deductedAmount: 0 }; }
    const cost = computeJobCost(r, rateCard);
    if (cost == null) return r; // no rate on file yet -- retry on a later sweep
    const key = r.client.trim().toLowerCase() + "|" + (r.city || "").trim().toLowerCase();
    const accountIdx = accountIndexByKey.get(key);
    if (accountIdx == null) return r; // no matching account yet -- retry on a later sweep
    deltas.set(accountIdx, (deltas.get(accountIdx) || 0) + cost);
    changed = true;
    applied.push({ client: r.client, city: r.city, refNo: r.refNo, amount: cost });
    return { ...r, deductionApplied: true, deductedAmount: cost };
  });
  if (!changed) return null;
  const final = updated.map((r, i) => {
    if (!deltas.has(i)) return r;
    return { ...r, tokenCount: Math.round(Math.max(0, (r.tokenCount || 0) - deltas.get(i)) * 100) / 100 };
  });
  return { requests: final, applied };
}

  useEffect(() => {

  // presence heartbeat: announce ourselves and prune stale entries every ~15s
  useEffect(() => {
    if (!loaded || !currentUser) return;
    const beat = async () => {
      try {
        const remote = (await kvGet(KV_PRESENCE)) || {};
        const now = Date.now();
        const fresh = {};
        Object.keys(remote).forEach(id => {
          if (now - new Date(remote[id].lastSeen).getTime() < PRESENCE_WINDOW_MS) fresh[id] = remote[id];
        });
        if (currentUser) {
          fresh[currentUser.id] = {
            firstName: currentUser.firstName,
            lastName: currentUser.lastName,
            role: currentUser.role,
            lastSeen: new Date().toISOString()
          };
        }
        await kvSet(KV_PRESENCE, fresh);
        lastPresenceSyncedRef.current = JSON.stringify(fresh);
        setPresence(fresh);
      } catch (e) { console.error("presence heartbeat failed", e); }
    };
    beat();
    const interval = setInterval(beat, 15000);
    return () => clearInterval(interval);
  }, [loaded, currentUserId, role]);

      try {
        const remote = await kvGet(KV_REQUESTS);
        const remoteJson = remote ? JSON.stringify(remote) : "";
        if (remoteJson && remoteJson !== lastSyncedRef.current) {
          lastSyncedRef.current = remoteJson;
          setRequests(remote);
        }
      } catch (e) {}
      try {
        const remoteRates = await kvGet(KV_RATE_CARD);
        const remoteRatesJson = remoteRates ? JSON.stringify(remoteRates) : "";
        if (remoteRatesJson && remoteRatesJson !== lastRateSyncedRef.current) {

        }
      } catch (e) {}
      try {

        const remoteClientsJson = remoteClients ? JSON.stringify(remoteClients) : "";
        if (remoteClientsJson && remoteClientsJson !== lastClientsSyncedRef.current) {
          lastClientsSyncedRef.current = remoteClientsJson;
          setClientsList(remoteClients);
        }
      } catch (e) {}
      try {
        const { data, error } = await sb.from("profiles").select("*");
        if (error) throw error;
        const mapped = (data || []).map(mapProfile);
        const mappedJson = JSON.stringify(mapped);
        if (mappedJson !== lastUsersSyncedRef.current) {

        }
      } catch (e) {}
      try {
        const remoteActivity = await kvGet(KV_ACTIVITY);
        const remoteActivityJson = remoteActivity ? JSON.stringify(remoteActivity) : "";
        if (remoteActivityJson && remoteActivityJson !== lastActivitySyncedRef.current) {

        }
      } catch (e) {}
      try {
        const remotePresence = await kvGet(KV_PRESENCE);
        const remotePresenceJson = remotePresence ? JSON.stringify(remotePresence) : "";
        if (remotePresenceJson && remotePresenceJson !== lastPresenceSyncedRef.current) {
          lastPresenceSyncedRef.current = remotePresenceJson;
          setPresence(remotePresence);
        }
      } catch (e) {}
    }, 10000);
    return () => clearInterval(interval);
  }, [loaded]);

  const saveForm = async () => {
    if (!isAdmin) return;
    const errs = {};
    if (!form.refNo.trim()) errs.refNo = "Please fill in reference no";
    if (!form.client.trim()) errs.client = "Please fill in client";
    if (form.type === "token" && !form.city.trim()) errs.city = "Please fill in city";
    if (!form.address.trim()) errs.address = "Please fill in address";
    if (!form.region.trim()) errs.region = "Please fill in region";
    if (!form.requestDate) errs.requestDate = "Please fill in request date";
    if (form.startTime && form.endTime && form.endTime <= form.startTime) errs.endTime = "End time must be after start time";
    if (includeRateInputs) {
      const n = parseInt(form.tokenCount, 10);
      if (!Number.isFinite(n) || n < 1) errs.tokenCount = "Enter a starting amount of $1 or more";
    }
    const editingExisting = editingId ? requests.find(r => r.id === editingId) : null;
    const editingAcct = editingExisting ? isTokenAccount(editingExisting) : false;
    if (editingAcct && isSuperAdmin) {
      const n = parseInt(form.tokenCount, 10);
      if (!Number.isFinite(n) || n < 0) errs.tokenCount = "Enter a balance of $0 or more";
    }
    setFieldErrors(errs);

    let rateErrs = {};
    let ratePayload = null;
    if (includeRateInputs) {
      const parseRate = val => val.trim() === "" ? null : Number(val);
      const bizH = parseRate(rateInputs.hourRateWeekdayBiz);
      const afterH = parseRate(rateInputs.hourRateWeekdayAfter);
      const weekendH = parseRate(rateInputs.hourRateWeekend);
      if (rateInputs.hourRateWeekdayBiz.trim() !== "" && (!Number.isFinite(bizH) || bizH < 0)) rateErrs.hourRateWeekdayBiz = "Enter a valid rate";
      if (rateInputs.hourRateWeekdayAfter.trim() !== "" && (!Number.isFinite(afterH) || afterH < 0)) rateErrs.hourRateWeekdayAfter = "Enter a valid rate";
      if (rateInputs.hourRateWeekend.trim() !== "" && (!Number.isFinite(weekendH) || weekendH < 0)) rateErrs.hourRateWeekend = "Enter a valid rate";
      setRateInputErrors(rateErrs);
      if (bizH != null || afterH != null || weekendH != null) {
        ratePayload = { hourRateWeekdayBiz: bizH, hourRateWeekdayAfter: afterH, hourRateWeekend: weekendH };
      }
    }

    if (Object.keys(errs).length > 0 || Object.keys(rateErrs).length > 0) return;

    let newRequests;
    let balanceAdjustLog = null;
    if (editingId) {
      newRequests = requests.map(r => {
        if (r.id !== editingId) return r;
        const schedule = r.type !== form.type ? buildSlots(form, r.schedule || [], isTokenAccount(r)) : r.schedule;
        // balance only ever changes via Top Up, a matured deduction sweep, or a direct Super
        // Admin edit on an account here -- never a plain edit otherwise
        let tokenCount = form.type !== "token" ? slotCountFor(form) : r.tokenCount;
        if (form.type === "token" && isTokenAccount(r) && isSuperAdmin) {
          const n = Math.max(0, parseInt(form.tokenCount, 10) || 0);
          if (n !== (r.tokenCount || 0)) balanceAdjustLog = { client: r.client, city: r.city, refNo: r.refNo, from: r.tokenCount || 0, to: n };
          tokenCount = n;
        }
        return { ...r, ...form, tokenCount, schedule };
      });
    } else {
      const tokenCount = form.type !== "token" ? slotCountFor(form)
        : includeRateInputs ? Math.max(0, parseInt(form.tokenCount, 10) || 0)
        : 0; // a new job-request has no balance of its own -- deduction lands on the account later
      // only the "new client" flow (Top Up Tokens -> new client) creates a token account;
      // a normal Add Request (even Token type, for an existing client) is a job, not an account
      newRequests = [...requests, { id: uid(), ...form, tokenCount, isAccount: includeRateInputs, deductionApplied: false, deductedAmount: null, schedule: buildSlots(form, [], includeRateInputs) }];
    }

    let newRateCard = rateCard;
    if (ratePayload) {
      const existing = findRate(rateCard, form.client, form.city);
      newRateCard = existing
        ? rateCard.map(r => r.id !== existing.id ? r : { ...r, ...ratePayload })
        : [...rateCard, { id: uid(), client: form.client, region: form.region, city: form.city, ...ratePayload }];
    }

    let newClientsList = clientsList;
    if (includeRateInputs && form.client.trim()) {
      const clientName = form.client.trim();
      newClientsList = clientsList.some(c => c.trim().toLowerCase() === clientName.toLowerCase()) ? clientsList : [...clientsList, clientName];
    }

    setFormSaveError("");
    setSaving(true);
    try {
      await kvSet(KV_REQUESTS, newRequests);
      if (newRateCard !== rateCard) await kvSet(KV_RATE_CARD, newRateCard);
      if (newClientsList !== clientsList) await kvSet(KV_CLIENTS, newClientsList);

      setRequests(newRequests);
      lastSyncedRef.current = JSON.stringify(newRequests);
      if (newRateCard !== rateCard) { setRateCard(newRateCard); lastRateSyncedRef.current = JSON.stringify(newRateCard); }
      if (newClientsList !== clientsList) { setClientsList(newClientsList); lastClientsSyncedRef.current = JSON.stringify(newClientsList); }

      const detail = includeRateInputs
        ? `Created Active Tokens account for ${form.client} (${form.city}) with starting balance $${(newRequests[newRequests.length - 1].tokenCount || 0).toLocaleString()}`
        : `${editingId ? "Edited" : "Added"} request ${form.refNo} for ${form.client}`;
      logActivity(editingId ? "edit-request" : "add-request", detail);
      if (balanceAdjustLog) {
        logActivity("balance-adjust", `Adjusted balance for ${balanceAdjustLog.client} (${balanceAdjustLog.city}) — $${balanceAdjustLog.from.toLocaleString()} → $${balanceAdjustLog.to.toLocaleString()}`);
      }
      setModalOpen(false);
    } catch (e) {
      console.error("save request failed", e);
      setFormSaveError("Could not save — check your connection and try again. Your entered data is still here.");

    });

  const openAddRate = () => {
